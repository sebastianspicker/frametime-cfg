// frametime.cfg - meta_october_2026.cfg
// Complete October 2026 CVar meta configuration for Counter-Strike 2.
//
// Research cutoff: 18 October 2026. Every name, default, and range below was
// checked against the CS2 convar dump at GameTracking-CS2 dad1537 (build of
// 14 October 2026). Deprecated, removed, hidden, cheat, and development-only
// CVars are excluded; the repo-checks name snapshot enforces that.
//
// HOW TO USE: copy to game\csgo\cfg\ and run: exec meta_october_2026
// It changes CVars only. Video settings live in the CS2 video menu (see
// assets/videosettings.txt); key binds, launch options, and device IDs stay
// yours. Back up your own autoexec.cfg first.
//
// Evidence: "meta" values come from the September 2026 ProSettings aggregate
// (947 pros) and October 2026 pro snapshots. Only frame cap, network, and
// telemetry values affect performance or diagnosis; everything else
// (viewmodel, HUD, audio, sensitivity) is preference to overwrite. The
// crosshair is left to Small Indie Crosshair Company (see the Crosshair section).

// -----------------------------------------------------------------------------
// Frame pacing and visibility
// -----------------------------------------------------------------------------

con_enable "1"
fps_max "400"                     // Default 120. No pro consensus (400-999 or 0);
                                  // keep a cap only while measured 1% lows hold it
fps_max_ui "200"                  // Default 0; caps menus only
r_player_visibility_mode "1"      // Boost Player Contrast on (meta)
r_drawtracers_firstperson "0"     // Default 1; no first-person tracers
r_fullscreen_gamma "2.2"          // Default; brightness, fullscreen only
r_show_build_info "1"             // Default; keeps build evidence in bug reports
cl_showfps "0"                    // Use the telemetry HUD below instead

// -----------------------------------------------------------------------------
// Network and matchmaking
// -----------------------------------------------------------------------------

rate "786432"                     // In-game "Unrestricted"; default 80000
cl_net_buffer_ticks "0"           // Buffering None (meta); 1-2 only for measured loss
mm_dedicated_search_maxping "150" // Default; lower only if you keep getting high-ping servers
cl_timeout "30"                   // Default

// Conditional telemetry: 0 never, 1 only when poor, 2 always. Thresholds
// 8 ms / 60 ms / 1% are stricter than the defaults 100 ms / 100 ms / 2%.
cl_hud_telemetry_frametime_show "1"
cl_hud_telemetry_frametime_poor "8"
cl_hud_telemetry_ping_show "1"
cl_hud_telemetry_ping_poor "60"
cl_hud_telemetry_net_misdelivery_show "1"
cl_hud_telemetry_net_misdelivery_poor "1"
cl_hud_telemetry_net_detailed "1"         // Loss/late/jitter breakdown when poor
cl_hud_telemetry_net_quality_graph_show "0"
cl_hud_telemetry_serverrecvmargin_graph_show "0"

// -----------------------------------------------------------------------------
// Mouse and movement
// -----------------------------------------------------------------------------

// 800 DPI x 1.0 = 800 eDPI; the 2026 pro median is 830 eDPI (66% of pros use
// 400 DPI, 28% 800 DPI). Keep your trained sensitivity if it differs.
// Raw input has no CVar in CS2; there is nothing to set.
sensitivity "1.0"                 // Default 1.25
zoom_sensitivity_ratio "1.0"      // Default; meta keeps 1
m_pitch "0.022"                   // Default
m_yaw "0.022"                     // Default
mouse_inverty "0"
option_duck_method "0"            // Hold to duck
option_speed_method "0"           // Hold to walk

// -----------------------------------------------------------------------------
// Crosshair
// -----------------------------------------------------------------------------

// Crosshair settings (cl_crosshair*, cl_grenadecrosshair*, observer
// crosshair) are owned by Small Indie Crosshair Company, which converts old
// settings to the pixel system of 22 September 2026:
// https://github.com/sebastianspicker/small-indie-crosshair-company
// This file sets none of them, so it never overrides your converted crosshair.

// -----------------------------------------------------------------------------
// Viewmodel (FOV 68 is used by about 86% of pros)
// -----------------------------------------------------------------------------

viewmodel_presetpos "1"           // 1 Desktop, 2 Classic; set before the offsets
viewmodel_fov "68"                // Default 60, maximum 68
viewmodel_offset_x "2.5"          // Default 1, maximum 2.5
viewmodel_offset_y "0"            // Default 1
viewmodel_offset_z "-1.5"         // Default -1
cl_prefer_lefthanded "0"

// -----------------------------------------------------------------------------
// Radar and HUD (pro mode: centered, rotating, zoom 0.4, HUD scale 1)
// -----------------------------------------------------------------------------

cl_radar_always_centered "1"
cl_radar_rotate "1"
cl_radar_scale "0.4"
cl_radar_scale_alternate "1.0"
cl_radar_scale_dynamic "0"
cl_radar_icon_scale_min "0.6"
cl_radar_square_with_scoreboard "1"
cl_hud_radar_scale "1.0"
cl_hud_radar_background_alpha "1.0"
cl_hud_radar_map_additive "1"

hud_scaling "1.0"
safezonex "1.0"
safezoney "1.0"
hud_showtargetid "1"
cl_hud_color "0"                  // Team color; preference
cl_showloadout "1"
cl_teamid_overhead_mode "3"
cl_teamid_overhead_colors_show "1"
cl_teamid_overhead_fade_near_crosshair "0.5"
cl_teammate_colors_show "2"
cl_teamcounter_playercount_instead_of_avatars "1"
cl_allow_animated_avatars "0"
cl_show_equipped_character_for_player_avatars "0"
cl_show_clan_in_death_notice "0"
cl_weapon_selection_rarity_color "0"

// -----------------------------------------------------------------------------
// Gameplay client behavior
// -----------------------------------------------------------------------------

cl_autohelp "0"
gameinstructor_enable "0"
cl_new_user_phase "-1"            // Disabled: experienced player
cl_dm_buyrandomweapons "0"
cl_silencer_mode "0"              // No accidental suppressor removal
cl_use_opens_buy_menu "0"
cl_buywheel_nonumberpurchasing "1"
cl_buywheel_donate_key "0"
cl_inventory_radial_immediate_select "1"
cl_inventory_radial_tap_to_cycle "1"
cl_sniper_auto_rezoom "0"
cl_sniper_delay_unscope "0"
cl_sniper_show_inaccuracy "0"
cl_spec_show_bindings "0"
cl_radial_radio_tap_to_ping "1"
cl_ragdoll_limit "0"              // Low clutter; not a measured FPS gain

// Server-confirmed hit feedback only (Damage Prediction off in the menu).
cl_predict_body_shot_fx "0"
cl_predict_head_shot_fx "0"
cl_predict_kill_ragdolls "0"

// -----------------------------------------------------------------------------
// Audio and voice
// -----------------------------------------------------------------------------

// Select the real headset or IEM in CS2; never set speaker_config or a device
// ID. EQ advice is split between guides and unmeasured: Natural (0) is Valve's
// default, Crisp (1) the common alternative, Smooth (2) rated worst for cues.
volume "0.70"                     // Guides 0.65-0.80; protect your hearing first
snd_headphone_eq "0"              // Natural
snd_spatialize_lerp "0"           // Default; mapping to the L/R Isolation slider unverified
snd_mute_losefocus "1"
snd_voipvolume "0.70"             // Default 1; guides 0.30-0.70
voice_modenable "1"               // Push-to-talk; the bind stays yours
voice_always_sample_mic "0"
voice_loopback "0"

// Music and round sounds: everything off except a quiet ten-second warning.
// The unsuffixed set covers Competitive and Premier (no _competitive set
// exists); the suffixed sets were added for other modes on 22 September 2026.
snd_menumap_volume "0"
snd_menumusic_volume "0"
snd_roundstart_volume "0"
snd_roundaction_volume "0"
snd_roundend_volume "0"
snd_mapobjective_volume "0"
snd_deathcamera_volume "0"
snd_mvp_volume "0"
snd_tensecondwarning_volume "0.10"
snd_mute_mvp_music_live_players "1"
snd_menumusic_volume_casual "0"
snd_roundstart_volume_casual "0"
snd_roundaction_volume_casual "0"
snd_roundend_volume_casual "0"
snd_mapobjective_volume_casual "0"
snd_deathcamera_volume_casual "0"
snd_mvp_volume_casual "0"
snd_tensecondwarning_volume_casual "0.10"
snd_menumusic_volume_deathmatch "0"
snd_roundstart_volume_deathmatch "0"
snd_roundaction_volume_deathmatch "0"
snd_roundend_volume_deathmatch "0"
snd_mapobjective_volume_deathmatch "0"
snd_deathcamera_volume_deathmatch "0"
snd_mvp_volume_deathmatch "0"
snd_tensecondwarning_volume_deathmatch "0.10"
snd_menumusic_volume_armsrace "0"
snd_roundstart_volume_armsrace "0"
snd_roundaction_volume_armsrace "0"
snd_roundend_volume_armsrace "0"
snd_mapobjective_volume_armsrace "0"
snd_deathcamera_volume_armsrace "0"
snd_mvp_volume_armsrace "0"
snd_tensecondwarning_volume_armsrace "0.10"
snd_menumusic_volume_rush "0"
snd_roundstart_volume_rush "0"
snd_roundaction_volume_rush "0"
snd_roundend_volume_rush "0"
snd_mapobjective_volume_rush "0"
snd_deathcamera_volume_rush "0"
snd_mvp_volume_rush "0"
snd_tensecondwarning_volume_rush "0.10"

// -----------------------------------------------------------------------------
// Lobby, privacy, and distraction control
// -----------------------------------------------------------------------------

cl_invites_only_mainmenu "1"
cl_invites_only_friends "0"
cl_hide_avatar_images "0"
cl_sanitize_muted_players "1"
cl_sanitize_player_names "0"
cl_server_graphic1_enable "0"
cl_server_graphic2_enable "0"

// Not included on purpose: Reflex / Anti-Lag 2 (video menu; r_low_latency is
// development-only), multi-input or movement-combining binds (Valve ignores or
// kicks them), and legacy CS:GO tweaks that no longer exist in CS2.

echo "[frametime-cfg] meta_october_2026 loaded - CS2 build of 14 October 2026"
