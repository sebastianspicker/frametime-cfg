// net_bad.cfg - frametime.cfg
// Maximum current UI-backed trial for severe missed delivery that persists at
// 1 Packet. Corresponds to the in-game buffering option "2 Packets" (label
// mapping from community guides) and adds more latency. cl_net_buffer_ticks
// drives cl_interp_ratio; do not set that directly. High RTT alone is not a
// reason to use this profile.
//
// HOW TO USE: exec net_bad
// REVERT:     exec net_stable

cl_net_buffer_ticks "2"

echo "[frametime.cfg] net_bad - buffering 2 Packets (cl_net_buffer_ticks 2)"
