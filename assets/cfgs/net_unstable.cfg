// net_unstable.cfg - frametime.cfg
// First buffered trial for telemetry-confirmed jitter or missed delivery.
// Matches the August 2026 in-game "1 Packet" setting and adds one tick of
// client buffering. Keep it only when a same-route comparison improves play.
//
// HOW TO USE: exec net_unstable
// REVERT:     exec net_stable

cl_net_buffer_ticks "1"

echo "[frametime.cfg] net_unstable - buffering 1 Packet (cl_net_buffer_ticks 1)"
