// net_unstable.cfg - frametime.cfg
// First buffered trial for telemetry-confirmed jitter or missed delivery.
// Corresponds to the in-game buffering option "1 Packet" (label mapping from
// community guides) and adds one tick of client buffering. cl_net_buffer_ticks
// drives cl_interp_ratio; do not set that directly. Keep this only when a
// same-route comparison improves play.
//
// HOW TO USE: exec net_unstable
// REVERT:     exec net_stable

cl_net_buffer_ticks "1"

echo "[frametime.cfg] net_unstable - buffering 1 Packet (cl_net_buffer_ticks 1)"
