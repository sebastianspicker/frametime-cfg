// audio_stable.cfg - frametime.cfg
// October 2026 portable audio reset; values are the defaults in the convar
// dump at GameTracking-CS2 dad1537 (14 October 2026). Natural EQ is the UI
// default; the link between snd_spatialize_lerp and the UI L/R Isolation
// slider is unverified. The latency CVars only restore defaults.
// Select the real output device in CS2; never set speaker_config or a device ID.
//
// HOW TO USE: exec audio_stable

snd_headphone_eq "0"
snd_spatialize_lerp "0"
snd_autodetect_latency "1"
snd_mixahead "0.001"

echo "[frametime.cfg] audio_stable - audio defaults restored (Natural EQ)"
