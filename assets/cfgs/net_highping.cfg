// net_highping.cfg - frametime.cfg
// Stable delivery with high base RTT: in-game buffering = None.
// Client buffering cannot remove propagation or routing latency and would add
// delay when telemetry does not show late or missed delivery.
//
// HOW TO USE: exec net_highping

cl_net_buffer_ticks "0"

echo "[frametime.cfg] net_highping - buffering None; client buffering cannot reduce base RTT"
