// frametime.cfg - August 2026 maximum-competitive pro-consensus profile
// Research cutoff: 23 August 2026; CS2 snapshot pinned to 19 August 2026.
//
// Manual opt-in only: exec competitive_2026
// This is a tournament-style modal profile assembled from the current
// 933-player aggregate and current elite-player snapshots. It deliberately
// chooses one branch where professional settings disagree. It never writes
// video-file enums, launch options, key binds, or device identifiers.

// -----------------------------------------------------------------------------
// Console, frame pacing, presentation, and visibility
// -----------------------------------------------------------------------------

con_enable "1"
fps_max "400"                     // Current portable pro/recovery cap
fps_max_ui "200"
fps_max_tools "120"
engine_no_focus_sleep "20"
r_player_visibility_mode "1"      // Boost Player Contrast
r_drawtracers_firstperson "0"
r_fullscreen_gamma "2.2"
r_show_build_info "1"
cl_showfps "0"

// -----------------------------------------------------------------------------
// Network, matchmaking, and low-noise telemetry
// -----------------------------------------------------------------------------

rate "786432"
cl_net_buffer_ticks "0"
mm_dedicated_search_maxping "50"
cl_timeout "30"

cl_hud_telemetry_frametime_show "1"
cl_hud_telemetry_frametime_poor "8"
cl_hud_telemetry_ping_show "1"
cl_hud_telemetry_ping_poor "50"
cl_hud_telemetry_net_misdelivery_show "1"
cl_hud_telemetry_net_misdelivery_poor "1"
cl_hud_telemetry_net_quality_graph_show "0"
cl_hud_telemetry_net_detailed "0"
cl_hud_telemetry_serverrecvmargin_graph_show "0"

// -----------------------------------------------------------------------------
// Pro-consensus input starting point
// -----------------------------------------------------------------------------

// Set the mouse itself to 800 DPI before using sensitivity 1.0. This is
// 800 eDPI, close to the August 2026 professional median of 830 eDPI.
// Preserve an already-trained sensitivity instead of repeatedly changing it.
sensitivity "1.0"
zoom_sensitivity_ratio "1.0"
m_pitch "0.022"
m_yaw "0.022"
mouse_inverty "0"
option_duck_method "0"
option_speed_method "0"

// -----------------------------------------------------------------------------
// Compact static pro-consensus crosshair
// -----------------------------------------------------------------------------

cl_crosshairstyle "4"
cl_crosshairsize "1"
cl_crosshairthickness "1"
cl_crosshairgap "-4"
cl_crosshairdot "0"
cl_crosshair_t "0"
cl_crosshair_drawoutline "0"
cl_crosshairusealpha "1"
cl_crosshairalpha "255"
cl_crosshaircolor "1"             // Green preset; avoids ambiguous custom RGB
cl_crosshairgap_useweaponvalue "0"
cl_crosshair_recoil "0"
cl_crosshair_friendly_warning "1"
cl_crosshair_sniper_width "1"

// -----------------------------------------------------------------------------
// Immediate grenade crosshair
// -----------------------------------------------------------------------------

cl_grenadecrosshair_decoy "1"
cl_grenadecrosshair_explosive "1"
cl_grenadecrosshair_fire "1"
cl_grenadecrosshair_flash "1"
cl_grenadecrosshair_smoke "1"
cl_grenadecrosshair_keepusercrosshair "1"
cl_grenadecrosshairdelay_decoy "0"
cl_grenadecrosshairdelay_explosive "0"
cl_grenadecrosshairdelay_fire "0"
cl_grenadecrosshairdelay_flash "0"
cl_grenadecrosshairdelay_smoke "0"

// -----------------------------------------------------------------------------
// Maximum-clearance viewmodel
// -----------------------------------------------------------------------------

viewmodel_presetpos "0"
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "0"
viewmodel_offset_z "-1.5"
cl_prefer_lefthanded "0"

// -----------------------------------------------------------------------------
// Pro-modal radar, HUD, teammate information, and visual noise
// -----------------------------------------------------------------------------

cl_radar_always_centered "1"
cl_radar_rotate "1"
cl_radar_scale "0.4"
cl_radar_scale_alternate "1.0"
cl_radar_scale_dynamic "0"
cl_radar_icon_scale_min "0.6"
cl_radar_square_with_scoreboard "1"
cl_hud_radar_scale "1.0"
cl_hud_radar_background_alpha "1.0"
cl_hud_radar_map_additive "1"

hud_scaling "1.0"
safezonex "1.0"
safezoney "1.0"
hud_showtargetid "1"
cl_hud_color "0"
cl_showloadout "1"
cl_teamid_overhead_mode "3"
cl_teamid_overhead_colors_show "1"
cl_teamid_overhead_fade_near_crosshair "0.5"
cl_teammate_colors_show "2"
cl_teamcounter_playercount_instead_of_avatars "1"
cl_allow_animated_avatars "0"
cl_show_equipped_character_for_player_avatars "0"
cl_show_clan_in_death_notice "0"
cl_weapon_selection_rarity_color "0"

// -----------------------------------------------------------------------------
// Competitive client behavior
// -----------------------------------------------------------------------------

cl_autohelp "0"
gameinstructor_enable "0"
cl_new_user_phase "-1"
cl_dm_buyrandomweapons "0"
cl_silencer_mode "0"
cl_use_opens_buy_menu "0"
cl_buywheel_nonumberpurchasing "1"
cl_buywheel_donate_key "0"
cl_inventory_radial_immediate_select "1"
cl_inventory_radial_tap_to_cycle "1"
cl_sniper_auto_rezoom "0"
cl_sniper_delay_unscope "0"
cl_sniper_show_inaccuracy "0"
cl_show_observer_crosshair "2"
cl_observed_bot_crosshair "0"
cl_spec_show_bindings "0"
cl_radial_radio_tap_to_ping "1"
cl_ragdoll_limit "0"

// Keep server-confirmed hit feedback authoritative.
cl_predict_body_shot_fx "0"
cl_predict_head_shot_fx "0"
cl_predict_kill_ragdolls "0"

// -----------------------------------------------------------------------------
// Competitive audio, voice, and distraction control
// -----------------------------------------------------------------------------

// Crisp is the selected pro-guide branch in this opt-in profile. Natural is
// the neutral recovery baseline: exec audio_stable.
volume "0.70"
snd_headphone_eq "1"
snd_spatialize_lerp "0"           // Physical CS2 panning; hard L/R remains optional
snd_autodetect_latency "1"
snd_mixahead "0.001"
snd_mute_losefocus "1"
snd_voipvolume "1.0"
voice_modenable "1"
voice_always_sample_mic "0"
voice_loopback "0"

snd_menumap_volume "0"
snd_menumusic_volume "0"
snd_roundstart_volume "0"
snd_roundaction_volume "0"
snd_roundend_volume "0"
snd_mapobjective_volume "0"
snd_deathcamera_volume "0"
snd_mvp_volume "0"
snd_tensecondwarning_volume "0.10"
snd_mute_mvp_music_live_players "1"

// -----------------------------------------------------------------------------
// Low-distraction social/UI policy
// -----------------------------------------------------------------------------

cl_invites_only_mainmenu "1"
cl_invites_only_friends "0"
cl_hide_avatar_images "0"
cl_sanitize_muted_players "1"
cl_sanitize_player_names "0"
cl_server_graphic1_enable "0"
cl_server_graphic2_enable "0"

// -----------------------------------------------------------------------------
// Required in-game/driver UI companion settings
// -----------------------------------------------------------------------------

// Modal August 2026 pro-tournament branch:
//   Display mode: Fullscreen
//   Resolution: 1280x960, 4:3 stretched
//   Refresh rate: highest stable in Windows and CS2
//   V-Sync: Disabled; G-SYNC/FreeSync: Disabled; tearing accepted
//   NVIDIA Reflex: Enabled (not Boost); supported AMD: Anti-Lag 2 Enabled
//   Boost Player Contrast: Enabled
//   MSAA: 4x; use CMAA2/2x only when GPU headroom is insufficient
//   Global Shadows: Low; Dynamic Shadows: All
//   Model/Texture: Medium; Texture Filtering: Anisotropic 4x
//   Shader: Low; Particle: Low; Ambient Occlusion: Disabled
//   HDR: Quality; FidelityFX Super Resolution: Disabled
//   Damage Prediction body/head/kill effects: Disabled
//   Audio device: the real headset/IEM; virtual surround: Disabled
//   Mouse polling: 1000-4000 Hz, only as high as the system sustains cleanly
//
// Professional branches that remain valid:
//   exec frame_raw_uncapped for a measured tearing-accepted raw-latency trial.
//   exec audio_stable for Natural EQ; exec audio_legacy_lr_isolation for hard L/R.
//   Native 1920x1080 and higher AA/shadows are valid on elite hardware.
//   NVIDIA VRR uses G-SYNC + V-Sync + Reflex instead of this tournament branch.
//
// Steam Launch Options stay empty. Do not add -high, -threads, -tickrate 128,
// -allow_third_party_software, legacy interpolation/rate packs, or driver ULLM.

echo "[frametime-cfg] August 2026 maximum-competitive profile loaded"
