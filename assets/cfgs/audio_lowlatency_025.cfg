// audio_lowlatency_025.cfg - frametime.cfg
// Manual 0.025 mixahead stability experiment. This is 25 times the current
// 0.001 baseline and may trade later sound presentation for fewer dropouts.
// Confirm both values by console readback and revert after testing.
//
// HOW TO USE: exec audio_lowlatency_025
// REVERT:     exec audio_stable

snd_autodetect_latency "0"
snd_mixahead "0.025"

echo "[frametime.cfg] audio_lowlatency_025 - manual larger-buffer experiment"
