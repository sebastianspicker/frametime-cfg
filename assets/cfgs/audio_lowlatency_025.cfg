// audio_lowlatency_025.cfg - frametime.cfg
// Unproven manual experiment: snd_mixahead 0.025 is 25 times the 0.001
// default. No source shows that snd_mixahead has any effect in CS2; use it
// only to test a specific dropout problem, confirm both values by console
// readback, and revert afterwards.
//
// HOW TO USE: exec audio_lowlatency_025
// REVERT:     exec audio_stable

snd_autodetect_latency "0"
snd_mixahead "0.025"

echo "[frametime.cfg] audio_lowlatency_025 - unproven larger-buffer experiment"
