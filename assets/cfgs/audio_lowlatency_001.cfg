// audio_lowlatency_001.cfg - frametime.cfg
// Compatibility alias that restores the October 2026 defaults of
// snd_autodetect_latency and snd_mixahead. It is not a latency tool; no source
// shows either CVar changes CS2 audio latency. Use audio_stable to also reset
// EQ and L/R processing.
//
// HOW TO USE: exec audio_lowlatency_001
// REVERT:     exec audio_stable

snd_autodetect_latency "1"
snd_mixahead "0.001"

echo "[frametime.cfg] audio_lowlatency_001 - mixer defaults restored"
