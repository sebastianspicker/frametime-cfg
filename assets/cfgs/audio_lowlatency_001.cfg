// audio_lowlatency_001.cfg - frametime.cfg
// Compatibility alias for the August 2026 automatic mixer baseline.
// This resets only buffering; use audio_stable to reset EQ and L/R processing.
//
// HOW TO USE: exec audio_lowlatency_001
// REVERT:     exec audio_stable

snd_autodetect_latency "1"
snd_mixahead "0.001"

echo "[frametime.cfg] audio_lowlatency_001 - automatic mixer baseline alias"
