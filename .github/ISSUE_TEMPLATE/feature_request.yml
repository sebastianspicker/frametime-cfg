name: Change proposal
description: Propose a scoped feature or configuration change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the requested behavior and the implementation or measurement
        evidence available for review.

  - type: textarea
    id: description
    attributes:
      label: Proposed change
      description: State the current behavior, requested behavior, and intended user.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Reproduction or evidence
      description: |
        Link vendor documentation or provide sanitized, reproducible benchmark,
        trace, or test details. State uncertainty and conflicting results.
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: Runtime and recovery impact
      description: Identify required privileges, persistent changes, failure modes, and rollback needs.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Native CLI or workflow
        - Native GUI
        - Package authentication or trusted runtime
        - Windows adapter or reboot handoff
        - Hardware diagnostics
        - Driver preparation
        - Packaged CS2 configuration
        - Northclock or Driver Foundry tool workspace
        - CI or repository maintenance
        - Documentation
        - Other
    validations:
      required: true
