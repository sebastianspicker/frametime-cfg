---
name: Bug report
description: Report reproducible incorrect behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Include enough detail to reproduce the problem,
        but remove personal or private system information.

  - type: dropdown
    id: phase
    attributes:
      label: Which phase/step?
      options:
        - Phase 1 - Normal boot
        - Phase 2 - Safe Mode
        - Phase 3 - Final setup
        - FPS Cap Calculator
        - Cleanup
        - Verify-Settings
        - Desktop interface
        - Other
    validations:
      required: true

  - type: input
    id: step
    attributes:
      label: Step number (if applicable)
      placeholder: "e.g. Step 16, Step 27"

  - type: dropdown
    id: profile
    attributes:
      label: Profile used
      options:
        - SAFE
        - RECOMMENDED
        - COMPETITIVE
        - CUSTOM
        - YOLO
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: >-
        Describe the issue and include the relevant error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: textarea
    id: system
    attributes:
      label: System info
      description: CPU, GPU, RAM, Windows version, NVIDIA driver version
      placeholder: |
        CPU: Ryzen 7800X3D
        GPU: RTX 4070 Ti
        RAM: 32GB DDR5-6000
        Windows: 11 24H2 (Build 26100)
        NVIDIA: 572.16
    validations:
      required: true

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution mode
      options:
        - Live optimization
        - Full DRY-RUN
        - Scoped DRY-RUN
        - Smoke test
        - Not sure
    validations:
      required: true

  - type: input
    id: dryrun_context
    attributes:
      label: DRY-RUN context (if applicable)
      description: >-
        Include launcher, GPU branch, PowerShell version, final phase marker,
        exit code, and whether C:\FRAMETIME_CFG changed.
      placeholder: >-
        START.bat dry-run 3; Windows PowerShell 5.1; PHASE 2 marker missing;
        exit 1; C:\FRAMETIME_CFG unchanged

  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: >-
        Paste a sanitized error line, smoke marker, or log excerpt. Do not
        include personal paths, tokens, credentials, or private system data.
