---
name: Bug report
description: Report reproducible incorrect behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Include enough detail to reproduce the problem,
        but remove personal or private system information.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Native CLI command or workflow
        - Native GUI
        - Authenticated package or publisher validation
        - Trusted work directory, state, or reboot handoff
        - Packaged CS2 configuration
        - Hardware diagnostics
        - Driver preparation
        - Northclock or Driver Foundry tool workspace
        - Build, CI, or packaging
        - Other
    validations:
      required: true

  - type: input
    id: step
    attributes:
      label: Command, GUI action, or workflow operation (if applicable)
      placeholder: "e.g. frametime dry-run all, frametime hardware doctor, Phase 2"

  - type: dropdown
    id: profile
    attributes:
      label: Profile used
      options:
        - SAFE
        - RECOMMENDED
        - COMPETITIVE
        - CUSTOM
        - YOLO
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: >-
        Describe the issue and include the relevant error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: textarea
    id: system
    attributes:
      label: System info
      description: CPU, GPU, RAM, Windows version, NVIDIA driver version
      placeholder: |
        CPU: Ryzen 7800X3D
        GPU: RTX 4070 Ti
        RAM: 32GB DDR5-6000
        Windows: 11 24H2 (Build 26100)
        NVIDIA: 572.16
    validations:
      required: true

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution context
      options:
        - Authenticated release package
        - Unsigned development package
        - CLI dry-run
        - CLI workflow mutation
        - Native GUI
        - Read-only hardware diagnostic
        - Build or CI
        - Not sure
    validations:
      required: true

  - type: input
    id: command_context
    attributes:
      label: Command and package context (if applicable)
      description: >-
        Include the native command or GUI action, package mode, sanitized error,
        exit code, and whether C:\FRAMETIME_CFG changed.
      placeholder: >-
        frametime dry-run all; unsigned package; adapter capability unavailable;
        exit 1; C:\FRAMETIME_CFG unchanged

  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: >-
        Paste a sanitized error line, smoke marker, or log excerpt. Do not
        include personal paths, tokens, credentials, or private system data.
