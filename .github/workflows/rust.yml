name: Native Rust validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frametime-host:
    name: Frametime Rust host gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Enforce domain dependency boundary
        run: bash scripts/check-domain-boundary.sh
      - name: Enforce presentation and dependency boundaries
        run: bash scripts/check-architecture-boundaries.sh
      - name: Run strict Clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings -W clippy::too_many_lines -W clippy::cognitive_complexity
      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Run all-branch source preview
        run: cargo run -p frametime-cli --locked -- dry-run all

  frametime-windows:
    name: Frametime Rust Windows unsigned package gates
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: cargo-audit@0.22.2
      - name: Verify runtime package contract
        run: cargo test -p frametime-domain --test runtime_package_contract --locked
      - name: Run the native source gate
        shell: cmd
        run: scripts\verify.cmd
      - name: Build and structurally verify the unsigned development package
        shell: cmd
        run: |
          set "FRAMETIME_PUBLISHER_SPKI_SHA256=" || exit /b 1
          rem Package only the default fail-closed feature set. The source gate
          rem above compiles all features, including qualification-only code.
          cargo build --release -p frametime-cli -p frametime-gui --locked --target x86_64-pc-windows-msvc || exit /b 1
          call scripts\package.cmd /unsigned || exit /b 1
          call scripts\package.cmd /verify /unsigned || exit /b 1
          dist\frametime-cfg-rust\frametime.exe --help >nul || exit /b 1

  northclock:
    name: Northclock source gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Configure isolated build directory
        run: printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/northclock-target" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: cargo-deny@0.20.2
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: cargo-audit@0.22.2
      - name: Check formatting
        working-directory: tools/northclock
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        working-directory: tools/northclock
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings -W clippy::too_many_lines -W clippy::cognitive_complexity
      - name: Run workspace tests
        working-directory: tools/northclock
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Check the Windows target
        working-directory: tools/northclock
        run: cargo check --workspace --all-targets --all-features --target x86_64-pc-windows-msvc --locked
      - name: Check source hygiene and documentation links
        working-directory: tools/northclock
        run: |
          cargo run -p xtask --locked -- hygiene
          cargo run -p xtask --locked -- docs
      - name: Build documentation
        working-directory: tools/northclock
        run: cargo doc --workspace --no-deps --locked
      - name: Check spelling
        working-directory: tools/northclock
        run: |
          cargo install typos-cli --version 1.49.1 --locked
          typos .
      - name: Check dependency policy
        working-directory: tools/northclock
        run: |
          cargo deny check all
          cargo audit --file Cargo.lock --deny warnings
      - name: Check protocol driver workspace
        working-directory: tools/northclock
        run: |
          cargo fmt --manifest-path driver/Cargo.toml --all -- --check
          cargo clippy --manifest-path driver/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path driver/Cargo.toml --workspace --all-targets --all-features --locked
          cargo check --manifest-path driver/Cargo.toml --workspace --all-targets --all-features --locked
          cargo audit --file driver/Cargo.lock --deny warnings

  driver-foundry:
    name: Driver Foundry source gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: cargo-audit@0.22.2
      - name: Check formatting
        working-directory: tools/driver-foundry
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        working-directory: tools/driver-foundry
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests
        working-directory: tools/driver-foundry
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Build release binaries
        working-directory: tools/driver-foundry
        run: cargo build --release --workspace --all-features --locked
      - name: Audit dependencies
        working-directory: tools/driver-foundry
        run: cargo audit --deny warnings

  driver-foundry-windows:
    name: Driver Foundry Windows tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Run strict Windows Clippy
        working-directory: tools/driver-foundry
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run Windows workspace tests
        working-directory: tools/driver-foundry
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Build Windows release binaries
        working-directory: tools/driver-foundry
        run: cargo build --release --workspace --all-features --locked

  northclock-windows:
    name: Northclock Windows source gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Run Windows workspace tests
        working-directory: tools/northclock
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Run strict Windows Clippy
        working-directory: tools/northclock
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings -W clippy::too_many_lines -W clippy::cognitive_complexity
      - name: Build Windows release binaries
        working-directory: tools/northclock
        run: cargo build --release --workspace --all-features --locked
