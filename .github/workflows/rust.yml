name: Native Rust validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  classify:
    name: Classify native Rust CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the change classifier
        shell: bash
        run: bash scripts/test-ci-classifier.sh
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'full=true\n' >> "$GITHUB_OUTPUT"
          bash scripts/classify-ci-change.sh \
            "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" package-layout.txt \
            >> "$GITHUB_OUTPUT"

  frametime-host:
    name: Frametime Rust host gates
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: >-
            frametime-cargo-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-host-all-features-debug-${{
            hashFiles('Cargo.lock', 'Cargo.toml',
            'crates/*/Cargo.toml', 'repo-checks/Cargo.toml', 'rust-toolchain.toml',
            '.cargo/config.toml', '.cargo/config') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings -W clippy::too_many_lines -W clippy::cognitive_complexity
      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Run all-branch source preview
        run: cargo run -p frametime-cli --locked -- dry-run all

  frametime-windows:
    name: Frametime Rust Windows unsigned package gates
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.full != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: >-
            frametime-cargo-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-windows-all-features-debug-default-release-${{
            hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml',
            'repo-checks/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml',
            '.cargo/config') }}
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cargo-audit@0.22.2
      - name: Run the native source gate
        shell: cmd
        run: scripts\verify.cmd
      - name: Build and structurally verify the unsigned development package
        shell: cmd
        run: |
          set "FRAMETIME_PUBLISHER_SPKI_SHA256=" || exit /b 1
          rem Package only the default fail-closed feature set. The source gate
          rem above compiles all features, including qualification-only code.
          cargo build --release -p frametime-cli -p frametime-gui --locked --target x86_64-pc-windows-msvc || exit /b 1
          call scripts\package.cmd /unsigned || exit /b 1
          call scripts\package.cmd /verify /unsigned || exit /b 1
          dist\frametime-cfg-rust\frametime.exe --help >nul || exit /b 1
