name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Prevent CI abuse: cancel redundant runs, limit concurrent PR jobs
concurrency:
  group: security-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & credential detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan for secrets and credentials
        shell: bash
        run: |
          echo "=== Scanning for hardcoded secrets ==="
          FOUND=0
          # Scan first-party source, configuration, and documentation.
          EXCLUDE_ANALYSIS_PATHS='(^|/)(vendor|third_party|third-party|3rdparty|external)/|\.git/'

          # Patterns that should never appear in committed code
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'                          # AWS Access Key
            'ghp_[a-zA-Z0-9]{36}'                       # GitHub PAT (fine-grained)
            'github_pat_[a-zA-Z0-9_]{82}'               # GitHub PAT (classic)
            'gho_[a-zA-Z0-9]{36}'                       # GitHub OAuth
            'glpat-[a-zA-Z0-9\-_]{20,}'                 # GitLab PAT
            'sk-[a-zA-Z0-9]{20,}'                       # sk-style secret key
            'xox[boaprs]-[a-zA-Z0-9\-]+'                # Slack token
            'hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[a-zA-Z0-9]+' # Slack webhook
          )

          for pattern in "${PATTERNS[@]}"; do
            if grep -rEn "$pattern" --include='*.cmd' --include='*.rs' --include='*.toml' --include='Cargo.lock' --include='*.yml' --include='*.yaml' --include='*.json' --include='*.md' --include='*.txt' --include='*.cfg' --include='*.env' . 2>/dev/null | grep -Ev "$EXCLUDE_ANALYSIS_PATHS"; then
              echo "::error::Potential secret found matching pattern: $pattern"
              FOUND=$((FOUND + 1))
            fi
          done

          # Check for generic password/secret assignments
          if grep -rEin '(password|passwd|secret|token|api_key|apikey|private_key)\s*[:=]\s*["\x27][^"\x27]{8,}' --include='*.cmd' --include='*.rs' --include='*.toml' --include='Cargo.lock' --include='*.yml' --include='*.json' . 2>/dev/null | grep -Ev "$EXCLUDE_ANALYSIS_PATHS" | grep -v 'CONTRIBUTING' | grep -v 'SECURITY' | grep -v '#'; then
            echo "::error::Potential hardcoded credential assignment found"
            FOUND=$((FOUND + 1))
          fi

          # Check for private keys
          if grep -rn 'BEGIN.*PRIVATE KEY' . 2>/dev/null | grep -Ev "$EXCLUDE_ANALYSIS_PATHS" | grep -v '.github/workflows/security.yml'; then
            echo "::error::Private key found in repository"
            FOUND=$((FOUND + 1))
          fi

          if [ "$FOUND" -gt 0 ]; then
            echo "::error::Found potential secret(s). Review and remove before merging."
            exit 1
          fi
          echo "Secret scan: clean"

  native-runtime-boundary:
    name: Native runtime and package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enforce the native product surface
        shell: bash
        run: |
          echo "=== Checking native product surface ==="
          LEGACY_FILES=$(find . -maxdepth 1 -type f \
            \( -iname '*.ps1' -o -iname '*.psd1' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.xaml' \) \
            -print)
          if [ -n "$LEGACY_FILES" ]; then
            echo "::error::The root product surface must contain only the native Rust runtime:"
            printf '%s\n' "$LEGACY_FILES"
            exit 1
          fi
          if [ -e helpers ] || [ -e ui ]; then
            echo "::error::The root product surface must not contain an alternate helper or markup runtime"
            exit 1
          fi
          echo "Native product surface: clean"

      - name: Check native package boundary
        shell: bash
        run: |
          echo "=== Checking native package boundary ==="
          test -f scripts/package.cmd
          test -f package-layout.txt

          if grep -Ein '\.(ps1|psd1|bat|cmd|xaml)(/|$)' package-layout.txt; then
            echo "::error::The native package layout must not contain retired runtime files"
            exit 1
          fi

          for required_marker in \
            'if /i "%~x1"==".ps1"' \
            'PowerShell source file is not permitted in the package' \
            'PowerShell runtime or source dependency marker in package file'; do
            if ! grep -Fq "$required_marker" scripts/package.cmd; then
              echo "::error::scripts/package.cmd no longer enforces the native package boundary: $required_marker"
              exit 1
            fi
          done
          echo "Native package boundary: clean"

  workflow-integrity:
    name: Workflow file integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check workflow files for dangerous patterns
        shell: bash
        run: |
          echo "=== Checking GitHub Actions workflows ==="
          FOUND=0

          # Check for dangerous trigger that allows fork PRs to run with write access
          if grep -rn 'pull_request_target' .github/workflows/ 2>/dev/null | grep -v 'security\.yml'; then
            echo "::error::pull_request_target trigger found - risk of fork PR privilege escalation"
            FOUND=$((FOUND + 1))
          fi

          # Unpinned third-party actions (not actions/ or github/ org)
          if grep -rEn 'uses:\s+[^#]*@v[0-9]' .github/workflows/ 2>/dev/null | grep -v 'actions/' | grep -v 'github/'; then
            echo "::warning::Third-party action with tag (not SHA) found - pin to full SHA"
          fi

          # Expression injection - untrusted event data in run: blocks
          # These GitHub context values are attacker-controlled and must not
          # appear directly in shell commands (use env: block instead).
          UNSAFE_EXPRS=(
            'github\.event\.issue\.title'
            'github\.event\.issue\.body'
            'github\.event\.pull_request\.title'
            'github\.event\.pull_request\.body'
            'github\.event\.comment\.body'
            'github\.event\.review\.body'
            'github\.event\.review_comment\.body'
            'github\.event\.head_commit\.message'
            'github\.event\.commits\[.*\]\.message'
            'github\.event\.pull_request\.head\.ref'
            'github\.event\.pull_request\.head\.label'
          )
          # Build the dollar-brace-brace pattern dynamically to avoid
          # GitHub Actions expression evaluation in this run: block
          EXPR_OPEN='$'
          EXPR_OPEN="${EXPR_OPEN}{{"
          for expr in "${UNSAFE_EXPRS[@]}"; do
            if grep -rPn "\\${EXPR_OPEN}\s*${expr}" .github/workflows/ 2>/dev/null | grep -v '#'; then
              echo "::error::Potential expression injection found for ${expr} in workflow - use env: block instead"
              FOUND=$((FOUND + 1))
            fi
          done

          # Overly broad permissions (write-all)
          if grep -rEn 'permissions:\s*write-all' .github/workflows/ 2>/dev/null; then
            echo "::error::write-all permissions found - use least-privilege scoping"
            FOUND=$((FOUND + 1))
          fi

          # workflow_dispatch inputs used directly in run: (template injection)
          if grep -rPn '\$\{\{\s*github\.event\.inputs\.' .github/workflows/ 2>/dev/null | grep -v 'env:' | grep -v '#'; then
            echo "::warning::workflow_dispatch input used in expression - verify it is sanitized or passed via env:"
          fi

          if [ "$FOUND" -gt 0 ]; then
            exit 1
          fi
          echo "Workflow integrity check: clean"
