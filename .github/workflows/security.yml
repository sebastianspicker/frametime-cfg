name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & credential detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  native-runtime-boundary:
    name: Native runtime and package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0

      - name: Enforce native runtime and package boundaries
        run: cargo test -p repo-checks --locked --test package_surface

  workflow-integrity:
    name: Workflow file integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check workflow files for dangerous patterns
        shell: bash
        run: |
          echo "=== Checking GitHub Actions workflows ==="
          FOUND=0

          PR_TARGET='pull_request'
          PR_TARGET="${PR_TARGET}_target"
          if grep -rEn "^[[:space:]]*${PR_TARGET}:" .github/workflows/; then
            echo "::error::pull_request_target trigger found - risk of fork PR privilege escalation"
            FOUND=$((FOUND + 1))
          fi

          if grep -rEh '^[[:space:]]*-[[:space:]]+uses:' .github/workflows/ \
            | sed -E 's/.*@([^ #]+).*/\1/' \
            | grep -Ev '^[0-9a-f]{40}$'; then
            echo "::error::Action reference is not pinned to a full commit SHA"
            FOUND=$((FOUND + 1))
          fi

          # Expression injection - untrusted event data in run: blocks
          # These GitHub context values are attacker-controlled and must not
          # appear directly in shell commands (use env: block instead).
          UNSAFE_EXPRS=(
            'github\.event\.issue\.title'
            'github\.event\.issue\.body'
            'github\.event\.pull_request\.title'
            'github\.event\.pull_request\.body'
            'github\.event\.comment\.body'
            'github\.event\.review\.body'
            'github\.event\.review_comment\.body'
            'github\.event\.head_commit\.message'
            'github\.event\.commits\[.*\]\.message'
            'github\.event\.pull_request\.head\.ref'
            'github\.event\.pull_request\.head\.label'
          )
          # Build the dollar-brace-brace pattern dynamically to avoid
          # GitHub Actions expression evaluation in this run: block
          EXPR_OPEN='$'
          EXPR_OPEN="${EXPR_OPEN}{{"
          for expr in "${UNSAFE_EXPRS[@]}"; do
            if grep -rEn "\\${EXPR_OPEN}[[:space:]]*${expr}" .github/workflows/; then
              echo "::error::Potential expression injection found for ${expr} in workflow - use env: block instead"
              FOUND=$((FOUND + 1))
            fi
          done

          if grep -rEn 'permissions:\s*write-all' .github/workflows/ 2>/dev/null; then
            echo "::error::write-all permissions found - use least-privilege scoping"
            FOUND=$((FOUND + 1))
          fi

          if grep -rEn '\$\{\{[[:space:]]*github\.event\.inputs\.' .github/workflows/; then
            echo "::error::workflow_dispatch input must be passed through env and validated"
            FOUND=$((FOUND + 1))
          fi

          if [ "$FOUND" -gt 0 ]; then
            exit 1
          fi
          echo "Workflow integrity check: clean"
