[workspace]
resolver = "2"
members = [
    "crates/driver-foundry-common",
    "crates/driver-foundry-clean",
    "crates/driver-foundry-install",
    "crates/driver-foundry-gui",
    "crates/driver-foundry-cli",
]
default-members = ["crates/driver-foundry-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Driver Foundry contributors"]

[workspace.dependencies]
driver-foundry-common = { path = "crates/driver-foundry-common" }
driver-foundry-clean = { path = "crates/driver-foundry-clean" }
driver-foundry-install = { path = "crates/driver-foundry-install" }
driver-foundry-gui = { path = "crates/driver-foundry-gui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = true }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = { version = "0.36.1" }
