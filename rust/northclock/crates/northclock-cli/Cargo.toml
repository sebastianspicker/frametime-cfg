[package]
name = "northclock-cli"
description = "Typed command-line interface for Northclock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "northclock"
path = "src/main.rs"

[features]
default = []
experimental-hardware-writes = [
    "northclock-core/experimental-hardware-writes",
    "northclock-platform-windows/experimental-hardware-writes",
]

[dependencies]
clap = { workspace = true }
northclock-core = { path = "../northclock-core", version = "=0.1.0-alpha.1" }
northclock-platform-windows = { path = "../northclock-platform-windows", version = "=0.1.0-alpha.1" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
