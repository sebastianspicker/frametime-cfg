[workspace]
members = [
    "crates/frametime-core",
    "crates/frametime-driver",
    "crates/frametime-hardware",
    "crates/frametime-hardware-windows",
    "crates/frametime-windows",
    "crates/frametime-cli",
    "crates/frametime-gui",
]
resolver = "3"

[workspace.package]
version = "3.0.0-alpha.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/sebastianspicker/frametime-cfg"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.11.0"
regex = "1.12.2"
raw-cpuid = "11.6.0"
thiserror = "2.0.17"
toml = "1.1.4"
tempfile = "3.24.0"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
