// net_stable.cfg - frametime.cfg
// Repository baseline for a stable connection.
// Use this to reset after testing another repository network profile.
//
// Connection profile: low ping (<40ms), <1% loss, <5ms jitter
// Examples: wired ethernet, home fiber/cable, LAN
//
// HOW TO USE:  exec net_stable  (in CS2 console)
//
// Evidence boundary: the repository has no packet trace establishing a latency
// result for these values on another route or CS2 build.

cl_interp_ratio "1"
cl_interp "0"
cl_net_buffer_ticks "0"
cl_net_buffer_ticks_use_interp "1"
cl_tickpacket_desired_queuelength "0"
cl_timeout "30"
net_client_steamdatagram_enable_override "1"

echo "[frametime.cfg] net_stable - stable-route baseline"
