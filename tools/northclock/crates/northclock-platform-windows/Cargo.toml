[package]
name = "northclock-platform-windows"
description = "Safe Northclock adapters for Windows and installed hardware-vendor APIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
experimental-hardware-writes = ["northclock-core/experimental-hardware-writes"]
fuzzing = []

[dependencies]
northclock-core = { path = "../northclock-core", version = "=0.1.0-alpha.1" }
raw-cpuid = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
