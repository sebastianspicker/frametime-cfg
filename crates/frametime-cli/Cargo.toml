[package]
name = "frametime-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
qualified-shader-cache-delete = ["frametime-windows/qualified-shader-cache-delete"]

[[bin]]
name = "frametime"
path = "src/main.rs"

[dependencies]
clap.workspace = true
frametime-domain = { path = "../frametime-domain" }
frametime-app = { path = "../frametime-app" }
frametime-windows = { path = "../frametime-windows" }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[lints]
workspace = true
